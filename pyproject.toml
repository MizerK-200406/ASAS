[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas"
version = "0.1.0"
description = "AI Assessment System - Nền tảng Đánh giá & Hỗ trợ Học tập Cá nhân hóa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
